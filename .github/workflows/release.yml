# Release: on a pushed version tag (v<major>.<minor>.<patch>.<commit_num>),
# build all server and desktop packages and publish them as a GitHub release.
# Run it by hand (workflow_dispatch) to build the packages only, without a release.
name: Release

on:
  push:
    tags: ['v*.*.*.*']
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Build the packages only, without a release'
        type: boolean
        default: true
      runs_on:
        description: 'macOS runner for the build (all 26 files are built on it, for every OS and arch)'
        type: choice
        default: macos-15
        options: [macos-15, macos-15-intel, macos-14]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build packages
    # macOS builds every package, 26 files: the desktop app for macOS, Windows
    # and Linux (x64 and arm64; installer and portable), and the server for
    # Linux x64 and arm64, Linux x64 el7 (RHEL/CentOS 7), macOS x64 and arm64,
    # and Windows x64.
    # By hand: the runs_on input. On a tag push: the repository variable
    # RELEASE_RUNNER when set (e.g. macos-15-intel while macOS arm64 runners
    # are short), otherwise macos-15.
    runs-on: ${{ inputs.runs_on || vars.RELEASE_RUNNER || 'macos-15' }}
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # commit_num in the version counts commits: needs the full history.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Check the version
        id: version
        run: |
          version="$(node scripts/product-version.cjs)"
          echo "Version $version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version of this commit (v$version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      # rpmbuild (desktop and server rpm), dpkg-deb (server deb) and GNU ar
      # (desktop deb); without them those packages are skipped.
      - name: Install packaging tools
        timeout-minutes: 15
        run: brew install rpm dpkg binutils

      # The server executables embed Node.js scripts/build-server-sea.mjs
      # NODE_VERSION; the build itself must run on the same major version.
      - name: Check the Node.js version
        run: |
          sea=$(sed -n "s/^export const NODE_VERSION = 'v\([0-9]*\)\..*/\1/p" scripts/build-server-sea.mjs)
          runner=$(node -p 'process.versions.node.split(".")[0]')
          echo "runner $(uname -m), runner Node.js $runner, server executables Node.js $sea"
          [ -n "$sea" ] && [ "$runner" = "$sea" ]

      # electron-builder's tool downloads (fpm, appimage, nsis, ...), reused between runs.
      - name: Cache electron-builder tools
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron-builder
          key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-builder-${{ runner.os }}-${{ runner.arch }}-

      - name: Build server packages
        timeout-minutes: 25
        run: npm run package:server

      # After the server: the desktop app needs the web-manager build made for Electron.
      # Installer and portable for each OS and arch (no signing, no Wine needed),
      # in two runs. A packaging command that prints nothing and uses no CPU for
      # 3 min (5 for the Linux one) is stopped with the list of processes still
      # running, instead of hanging until the timeout; quiet work that keeps the
      # CPU busy (rpm compression, minutes on an Intel runner) is waited for.
      # A disk image still attached, or an hdiutil / dmgbuild process left over,
      # has kept this step from ending after its dmg files were written: clean up
      # before and after, and end the step once every file is complete.
      - name: Build desktop packages (macOS, Windows)
        timeout-minutes: 40
        run: |
          scripts/ci/clean-disk-images.sh
          v='${{ steps.version.outputs.version }}'
          done_check="cd dist/portable && for f in macos-arm64.dmg macos-arm64.zip macos-x64.dmg macos-x64.zip windows-x64-setup.exe windows-arm64-setup.exe; do [ -s CUBRID-Admin-desktop-$v-\$f.blockmap ] || exit 1; done; for f in windows-x64-portable.exe windows-arm64-portable.exe; do [ -s CUBRID-Admin-desktop-$v-\$f ] || exit 1; done"
          scripts/ci/run-with-idle-timeout.sh 180 --done-check "$done_check" npx nx run desktop:package -- --mac --win --x64 --arm64

      - name: Detach disk images
        if: always()
        run: scripts/ci/clean-disk-images.sh

      - name: Build desktop packages (Linux)
        timeout-minutes: 40
        run: scripts/ci/run-with-idle-timeout.sh 300 npx nx run desktop:package -- --linux --x64 --arm64

      - name: Collect release files
        timeout-minutes: 10
        run: npm run package:archive

      - name: Check release files
        working-directory: dist/release
        run: |
          version='${{ steps.version.outputs.version }}'
          missing=0
          for name in \
            desktop-$version-macos-arm64.dmg desktop-$version-macos-arm64.zip \
            desktop-$version-macos-x64.dmg desktop-$version-macos-x64.zip \
            desktop-$version-windows-x64-setup.exe desktop-$version-windows-x64-portable.exe \
            desktop-$version-windows-arm64-setup.exe desktop-$version-windows-arm64-portable.exe \
            desktop-$version-linux-x64.rpm desktop-$version-linux-x64.deb desktop-$version-linux-x64.AppImage \
            desktop-$version-linux-arm64.rpm desktop-$version-linux-arm64.deb desktop-$version-linux-arm64.AppImage \
            server-$version-linux-x64.tar.gz server-$version-linux-x64.rpm server-$version-linux-x64.deb \
            server-$version-linux-arm64.tar.gz server-$version-linux-arm64.rpm server-$version-linux-arm64.deb \
            server-$version-linux-x64-el7.tar.gz server-$version-linux-x64-el7.rpm \
            server-$version-macos-x64.tar.gz server-$version-macos-arm64.tar.gz \
            server-$version-windows-x64.zip server-$version-windows-x64-setup.exe; do
            if [ ! -f "CUBRID-Admin-$name" ]; then
              echo "::error::Missing CUBRID-Admin-$name"
              missing=1
            fi
          done
          [ "$missing" = 0 ]
          # 26 files: desktop 14, server 12.
          [ "$(wc -l < SHA256SUMS.txt)" -eq 26 ]
          shasum -a 256 -c SHA256SUMS.txt
          file CUBRID-Admin-desktop-*
          for rpm in CUBRID-Admin-desktop-*.rpm; do
            file "$rpm" | grep -q 'RPM' || { echo "::error::$rpm is not an rpm"; exit 1; }
          done
          ls -l

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            dist/release/CUBRID-Admin-*
            dist/release/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
          # The packages are already compressed.
          compression-level: 0

  release:
    name: Publish release
    needs: build
    if: >-
      github.repository == 'CUBRID/cubrid-admin' &&
      github.ref_type == 'tag' &&
      (github.event_name == 'push' || !inputs.build_only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.version }}
          path: release

      - name: Check release files
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt

      # The first-run guide goes before GitHub's generated notes. The notes are
      # Markdown: commands in backticks so <파일> is shown as text.
      - name: Create release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/first-run.md" <<'NOTES'
          macOS: 처음 실행할 때 확인되지 않은 개발자 경고로 열리지 않으면 시스템 설정 > 개인정보 보호 및 보안에서 '그래도 열기'를 누르거나, 터미널에서 `xattr -dr com.apple.quarantine "CUBRID Admin.app"` 을 실행합니다.

          Windows: SmartScreen 경고가 뜨면 '추가 정보' > '실행'을 누릅니다.

          파일 확인: `shasum -a 256 -c SHA256SUMS.txt` (Windows는 `certutil -hashfile <파일> SHA256`)

          macOS 13 이상이 필요합니다. Apple silicon Mac에서는 arm64 빌드를 쓰세요(x64 빌드는 Rosetta로 실행되어 시작과 종료가 느립니다).

          Linux AppImage: `chmod +x` 후 실행합니다. GTK 3, NSS, ALSA, libgbm 같은 데스크톱 라이브러리가 시스템에 있어야 합니다(rpm, deb 패키지는 함께 설치합니다).

          이전 테스트 빌드를 쓰던 경우: 설정과 기본 워크스페이스 위치가 바뀌었습니다(설치형은 사용자 데이터 폴더, 포터블은 앱 옆).

          RHEL/CentOS 7 서버: el7 패키지(`linux-x64-el7.rpm`, `linux-x64-el7.tar.gz`)를 쓰세요.
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/first-run.md" --generate-notes \
            CUBRID-Admin-* SHA256SUMS.txt
