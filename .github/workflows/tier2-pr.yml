name: Run Tier 2 for PR
run-name: 'Tier 2 for PR #${{ inputs.pr_number }} at ${{ inputs.commit_sha }}'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test (review its code before launching)'
        required: true
        type: string
      commit_sha:
        description: 'Full 40-character head commit SHA you reviewed'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: manual-tier2-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate reviewed PR commit
    # The button must run the trusted workflow from the upstream default branch.
    if: >-
      github.repository == 'CUBRID/cubrid-admin' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      repository: ${{ steps.pr.outputs.repository }}
      sha: ${{ steps.pr.outputs.sha }}
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate selected PR commit
        id: pr
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        with:
          script: |
            const resolve = require('./.github/scripts/resolve-tier2-pr.cjs');
            await resolve({ github, context, core,
              prNumber: process.env.PR_NUMBER,
              expectedSha: process.env.EXPECTED_SHA });

  test:
    name: Test reviewed PR commit against CUBRID NCA
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CUBRID_IMAGE: ghcr.io/srltas/cubrid-nca-nightly:latest
      CMS_HOST: '127.0.0.1'
      CMS_PORT: '28001'
      CMS_USER: admin
      CMS_PASSWORD: admin
      E2E_DB: demodb
      WEBMANAGER_REPO_PATH: ${{ github.workspace }}/app
      WEBMANAGER_SKIP_BUILD: 'true'
    steps:
      - name: Checkout trusted container configuration
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false

      - name: Preserve trusted container configuration
        run: cp control/docker-compose.e2e.yml "$RUNNER_TEMP/docker-compose.e2e.yml"

      - name: Checkout exact reviewed PR commit
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.sha }}
          path: app
          persist-credentials: false

      - name: Verify PR commit
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: test "$(git -C app rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check test-suite credential
        env:
          TCP_TOKEN: ${{ secrets.TCP_REPOSITORY_TOKEN }}
        run: |
          if [ -z "$TCP_TOKEN" ]; then
            echo '::error::Configure TCP_REPOSITORY_TOKEN in the upstream repository Actions secrets.'
            exit 1
          fi

      - name: Prepare private test-suite directory
        run: rm -rf app/tcp

      # Download before executing PR code; do not persist the PAT in Git config.
      - name: Download private TCP suite
        uses: actions/checkout@v4
        with:
          repository: CUBRID/cubrid-webmanager-e2e
          token: ${{ secrets.TCP_REPOSITORY_TOKEN }}
          path: app/tcp
          persist-credentials: false

      - name: Record TCP version
        run: |
          printf '\nTCP suite commit: %s\n' "$(git -C app/tcp rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/tcp/package-lock.json

      - name: Install and build PR application
        working-directory: app
        run: |
          npm ci
          npm run build:server

      - name: Install TCP and Chromium
        working-directory: app/tcp
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start temporary CUBRID NCA
        run: docker compose -f "$RUNNER_TEMP/docker-compose.e2e.yml" up -d --wait --wait-timeout 300

      - name: Run TCP against PR application
        working-directory: app/tcp
        run: npm test

      - name: Collect container diagnostics
        if: failure()
        run: docker compose -f "$RUNNER_TEMP/docker-compose.e2e.yml" logs --no-color --tail 200

      - name: Remove temporary container and volumes
        if: always()
        run: docker compose -f "$RUNNER_TEMP/docker-compose.e2e.yml" down -v --remove-orphans

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-report-pr-${{ needs.prepare.outputs.number }}-${{ needs.prepare.outputs.sha }}-${{ github.run_attempt }}
          path: app/tcp/playwright-report/
          if-no-files-found: warn
          retention-days: 14
