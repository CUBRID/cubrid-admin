# CI: Runs automatically on GitHub push/PR. Check the Actions tab for success/failure.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck api-server
        run: npx tsc -p apps/api-server/tsconfig.app.json --noEmit

      - name: Build all projects
        run: npx nx run-many --target=build --all

      # Artifact: dist uploaded only for direct pushes to develop in the official repository.
      - name: Upload dist
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'cubrid/cubrid-webmanager'
        uses: actions/upload-artifact@v4
        with:
          name: cubrid-webmanager-dist
          path: dist/
          retention-days: 30
          if-no-files-found: error

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Test api-server
        run: npm run test:api-server -- --passWithNoTests --forceExit
        env:
          CI: true

      - name: Test web-manager
        run: npm run test:web-manager -- --passWithNoTests --reporter=verbose
        env:
          CI: true

      - name: Validate cross-platform E2E discovery
        run: npm run e2e:check
        env:
          CI: true
          E2E_USERNAME: e2e_discovery
          E2E_PASSWORD: Password123!
          E2E_HOST_PASSWORD: admin
