<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/cubrid-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="/pwa-192x192.png">
    <title>CUBRID Admin</title>
    <!-- Inter has no Korean glyphs; without this, Korean text silently falls back to
         whatever CJK font happens to be installed on each OS, rendering inconsistently
         across machines/screenshots. Pretendard fills that gap for KR while Inter still
         renders all Latin text (see --font-display/--font-sans in styles/index.css).
         Bundled locally as a build asset (src/styles/fonts.css) instead of linked from
         jsDelivr here, so it's still available offline/behind a blocked CDN. -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          var supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches === true;
          if (!theme && supportDarkMode) theme = 'dark';
          if (!theme) theme = 'light';
          document.documentElement.className = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
